<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Penalty Shootout - Game v1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-wrap">
    <header>
      <h1>Penalty Shootout</h1>
    </header>

    <main>
      <section class="scoreboard">
        <div>Goals: <span id="goals">0</span></div>
        <div>Shots: <span id="shots-taken">0</span></div>
        <div>Remaining: <span id="shots-remaining">5</span></div>
      </section>

      <section class="arena">
        <!-- stadium background + field -->
        <div class="stadium">
          <div class="stands"></div>
          <div class="field">
            <div class="goal">
              <div class="goal-post left"></div>
              <div class="goal-net"></div>
              <div class="goal-post right"></div>
            </div>

            <!-- goalkeeper is positioned near the goal and will 'dive' -->
            <div id="goalkeeper" class="goalkeeper">
              <div class="head"></div>
              <div class="body"></div>
            </div>

            <!-- ball starts near bottom center -->
            <div id="ball" class="ball" aria-hidden="true"></div>

          </div>
        </div>
      </section>

      <section class="controls">
        <div class="instructions">Choose where to shoot:</div>
        <div class="buttons">
          <button class="shoot-btn" data-dir="left">Left</button>
          <button class="shoot-btn" data-dir="center">Center</button>
          <button class="shoot-btn" data-dir="right">Right</button>
        </div>

        <div id="result" class="result">Good luck!</div>

        <button id="restart" class="restart">Restart</button>
      </section>
    </main>

    <footer>
      <small>Playable on desktop and mobile — built with vanilla HTML, CSS & JavaScript</small>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
